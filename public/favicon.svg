<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="warmGlow" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#c97f3d" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#c97f3d" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c97f3d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Warm dark background -->
  <rect width="512" height="512" fill="#0d0c0a"/>
  <rect width="512" height="512" fill="url(#warmGlow)"/>

  <!-- Subtle inner border for depth -->
  <rect x="8" y="8" width="496" height="496" fill="none"
        stroke="#2a2620" stroke-width="2"/>

  <!-- Italic serif T in cream -->
  <text x="220" y="380"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="420"
        font-style="italic"
        font-weight="400"
        fill="#f0e9d8"
        text-anchor="middle">T</text>

  <!-- Amber accent dot — echoes the masthead "The Tape •" -->
  <circle cx="380" cy="360" r="30" fill="#c97f3d"/>
</svg>
