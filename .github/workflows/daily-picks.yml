name: Daily Stock Picks

# Runs daily after the US market close.
# Cron is ALWAYS in UTC. Singapore is UTC+8 (no DST).
#   '21 21 * * 1-5' = 5:21 AM SGT weekdays (current — just after US close,
#                     off-minute to dodge GitHub's top-of-hour load spike)
#   '0 21 * * 1-5'  = 5:00 AM SGT exactly (may be delayed at the hour mark)
#   '0 9 * * 1-5'   = 5:00 PM SGT weekdays (previous setting, post-SGX-close)
on:
  schedule:
    - cron: '21 21 * * 1-5'   # 5:21 AM SGT (21:21 UTC), just after US market close
  workflow_dispatch:  # allows manual trigger from GitHub UI

permissions:
  contents: write  # needed to commit picks.json back to repo

jobs:
  generate-picks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-finbert-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python daily_picks_bot.py --market top100 --output public/picks.json

      - name: Commit updated picks.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/picks.json public/history.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update daily picks ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          # Retry push up to 3 times with rebase, in case main moved during the run
          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push rejected on attempt $attempt — pulling latest and rebasing..."
            git pull --rebase --autostash origin main
            sleep 3
          done
          echo "Push failed after 3 attempts"
          exit 1
